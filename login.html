<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Secure Login</title>
    
    <!-- FIREBASE SDKS -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        // YOUR FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyAHS0Xk5o-PZK_bBGtsQqGlS9TLOcnXCsM",
            authDomain: "school-erp-3bd0a.firebaseapp.com",
            projectId: "school-erp-3bd0a",
            storageBucket: "school-erp-3bd0a.firebasestorage.app",
            messagingSenderId: "222944507292",
            appId: "1:222944507292:web:3b80280c1359b9fa6ec459"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
    </script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #1c2331, #3f51b5); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        .school-display { position: absolute; top: 30px; left: 0; right: 0; display: none; flex-direction: column; align-items: center; z-index: 10; animation: fadeInDown 0.6s ease; }
        .school-display img { width: 80px; height: 80px; border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 3px solid #fff; background: white; object-fit: contain; }
        .school-display h2 { color: white; margin-top: 10px; font-size: 24px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .school-display p { color: #ddd; font-size: 14px; margin-top: 5px; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 15px 30px rgba(0,0,0,0.3); width: 100%; max-width: 400px; z-index: 20; position: relative; }
        .login-box h2 { text-align: center; color: #333; margin-bottom: 5px; font-size: 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .login-box h2 img { width: 50px; height: 50px; }
        .login-box p.subtitle { text-align: center; color: #777; font-size: 13px; margin-bottom: 25px; }
        .tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 25px; }
        .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-weight: bold; color: #777; transition: 0.3s; border-bottom: 3px solid transparent; }
        .tab.active { color: #3f51b5; border-bottom: 3px solid #3f51b5; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; color: #555; margin-bottom: 8px; font-weight: bold; }
        .input-group input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; background: #f9f9f9; transition: 0.3s; }
        .input-group input:focus { outline: none; border-color: #3f51b5; background: #fff; box-shadow: 0 0 0 3px rgba(63,81,181,0.1); }
        .btn-login { width: 100%; padding: 14px; background: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-login:hover { background: #219a52; }
        .btn-login:disabled { background: #95a5a6; cursor: not-allowed; }
        .forgot-link { display: block; text-align: right; font-size: 12px; color: #e74c3c; margin-top: -10px; margin-bottom: 20px; text-decoration: none; cursor: pointer; }
        .forgot-link:hover { text-decoration: underline; }
        .school-code-step { display: none; }
        .change-school { display: block; text-align: center; font-size: 12px; color: #888; margin-top: 15px; text-decoration: none; cursor: pointer; }
        .change-school:hover { color: #333; text-decoration: underline; }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="school-display" id="schoolDisplay">
        <img id="topSchoolLogo" src="" alt="School Logo">
        <h2 id="topSchoolName">School Name</h2>
        <p id="topSchoolAddress">Address</p>
    </div>

    <div class="login-box">
        
        <!-- STEP 1: SCHOOL CODE ENTRY -->
        <div id="stepSchoolCode" class="school-code-step" style="display: block;">
            <h2><img src="https://cdn-icons-png.flaticon.com/128/2941/2941658.png" alt="Icon"> ERP Secure Access</h2>
            <p class="subtitle">Enter your School Code to continue</p>
            <div class="input-group">
                <label>School ID / Code</label>
                <input type="text" id="schoolCodeInput" placeholder="e.g. VIS" autocomplete="off" style="text-transform: uppercase;">
            </div>
            <button class="btn-login" id="btnVerifySchool">Verify School</button>
        </div>

        <!-- STEP 2: LOGIN ENTRY -->
        <div id="stepLogin" style="display: none;">
            <h2 id="formSchoolName">School Name</h2>
            <p class="subtitle">ERP Access Portal</p>
            
            <div class="tabs">
                <div class="tab active" id="tabStaff">Staff / Admin</div>
                <div class="tab" id="tabStudent">Student</div>
            </div>

            <!-- STAFF LOGIN FORM -->
            <div id="formStaff">
                <div class="input-group">
                    <label>Registered Email</label>
                    <input type="email" id="staffEmail" placeholder="admin@school.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="staffPassword" placeholder="••••••••">
                </div>
                <a class="forgot-link" onclick="alert('Please contact your ERP Administrator to reset your password.')">Forgot Password?</a>
                <button class="btn-login" id="btnStaffLogin">Secure Login</button>
            </div>

            <!-- STUDENT LOGIN FORM -->
            <div id="formStudent" style="display: none;">
                <div class="input-group">
                    <label>Portal User ID</label>
                    <input type="text" id="studentUserId" placeholder="e.g. 1">
                </div>
                <div class="input-group">
                    <label>Security PIN / Password</label>
                    <input type="password" id="studentPin" placeholder="••••••">
                </div>
                <a class="forgot-link" onclick="alert('Please contact the School Front Desk to recover your PIN.')">Forgot PIN/Password?</a>
                <button class="btn-login" id="btnStudentLogin">Student Login</button>
            </div>

            <a class="change-school" id="btnChangeSchool">← Change School Code</a>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // UI Logic
            const stepSchoolCode = document.getElementById('stepSchoolCode');
            const stepLogin = document.getElementById('stepLogin');
            const schoolDisplay = document.getElementById('schoolDisplay');
            
            const tabStaff = document.getElementById('tabStaff');
            const tabStudent = document.getElementById('tabStudent');
            const formStaff = document.getElementById('formStaff');
            const formStudent = document.getElementById('formStudent');

            let currentSchoolCode = localStorage.getItem('erp_school_code');
            
            // Check if school is already set
            if(currentSchoolCode) {
                loadSchoolData(currentSchoolCode);
            }

            // Tab Switching
            tabStaff.addEventListener('click', () => {
                tabStaff.classList.add('active'); tabStudent.classList.remove('active');
                formStaff.style.display = 'block'; formStudent.style.display = 'none';
            });
            tabStudent.addEventListener('click', () => {
                tabStudent.classList.add('active'); tabStaff.classList.remove('active');
                formStudent.style.display = 'block'; formStaff.style.display = 'none';
            });

            // Change School
            document.getElementById('btnChangeSchool').addEventListener('click', () => {
                localStorage.removeItem('erp_school_code');
                localStorage.removeItem('erp_school_name');
                localStorage.removeItem('erp_school_logo');
                schoolDisplay.style.display = 'none';
                stepLogin.style.display = 'none';
                stepSchoolCode.style.display = 'block';
                document.getElementById('schoolCodeInput').value = '';
            });

            // Verify School
            document.getElementById('btnVerifySchool').addEventListener('click', async () => {
                const code = document.getElementById('schoolCodeInput').value.trim().toUpperCase();
                const btn = document.getElementById('btnVerifySchool');
                
                if(!code) { alert("Please enter a valid School Code."); return; }
                
                btn.innerText = "Verifying..."; btn.disabled = true;

                try {
                    // Fetch school details from 'schools' collection in Firebase
                    const schoolDoc = await db.collection("schools").doc(code).get();
                    
                    if (schoolDoc.exists) {
                        const schoolData = schoolDoc.data();
                        localStorage.setItem('erp_school_code', code);
                        localStorage.setItem('erp_school_name', schoolData.name || code);
                        localStorage.setItem('erp_school_logo', schoolData.logoUrl || "https://cdn-icons-png.flaticon.com/128/2941/2941658.png");
                        
                        loadSchoolData(code);
                    } else {
                        // Fallback logic for when 'schools' collection doesn't exist yet but user wants to proceed
                        if(code === "VIS") {
                            localStorage.setItem('erp_school_code', "VIS");
                            localStorage.setItem('erp_school_name', "Vinayak International");
                            localStorage.setItem('erp_school_logo', "https://cdn-icons-png.flaticon.com/128/2941/2941658.png");
                            loadSchoolData("VIS");
                        } else {
                            alert("Invalid School Code. Not found in Database.");
                        }
                    }
                } catch (error) {
                    console.error("Error fetching school:", error);
                    alert("Database connection error. Try again.");
                } finally {
                    btn.innerText = "Verify School"; btn.disabled = false;
                }
            });

            function loadSchoolData(code) {
                const sName = localStorage.getItem('erp_school_name') || code;
                const sLogo = localStorage.getItem('erp_school_logo') || "https://cdn-icons-png.flaticon.com/128/2941/2941658.png";
                
                document.getElementById('topSchoolName').innerText = sName;
                document.getElementById('formSchoolName').innerText = sName;
                document.getElementById('topSchoolLogo').src = sLogo;
                document.getElementById('topSchoolAddress').innerText = `Authorized Access - ${code}`;
                
                stepSchoolCode.style.display = 'none';
                schoolDisplay.style.display = 'flex';
                stepLogin.style.display = 'block';
            }

            // ===============================================
            // 1. STAFF / ADMIN LOGIN (FIREBASE AUTH)
            // ===============================================
            document.getElementById('btnStaffLogin').addEventListener('click', async () => {
                const email = document.getElementById('staffEmail').value.trim();
                const pwd = document.getElementById('staffPassword').value;
                const btn = document.getElementById('btnStaffLogin');

                if(!email || !pwd) { alert("Please enter Email and Password."); return; }

                btn.innerText = "Authenticating..."; btn.disabled = true;

                try {
                    // Firebase Auth Login
                    const userCredential = await auth.signInWithEmailAndPassword(email, pwd);
                    const user = userCredential.user;

                    // Fetch employee details from 'users' collection
                    const userDoc = await db.collection("users").doc(user.uid).get();

                    if(userDoc.exists) {
                        const userData = userDoc.data();
                        
                        // Check if the user belongs to the selected school
                        if(userData.schoolCode !== localStorage.getItem('erp_school_code') && userData.Is_SuperAdmin !== "Yes") {
                            await auth.signOut();
                            alert("Access Denied: You are not authorized for this school.");
                            return;
                        }

                        // Save session
                        localStorage.setItem('erp_active_user', JSON.stringify(userData));
                        window.location.href = 'index.html'; // Go to Admin Dashboard
                    } else {
                        await auth.signOut();
                        alert("Account verified, but profile data missing in Database.");
                    }
                } catch (error) {
                    console.error("Login Error:", error);
                    alert("Invalid Credentials or Account Disabled.");
                } finally {
                    btn.innerText = "Secure Login"; btn.disabled = false;
                }
            });

            // ===============================================
            // 2. STUDENT LOGIN (FIRESTORE QUERY)
            // ===============================================
            document.getElementById('btnStudentLogin').addEventListener('click', async () => {
                const portalId = document.getElementById('studentUserId').value.trim();
                const pin = document.getElementById('studentPin').value;
                const btn = document.getElementById('btnStudentLogin');
                const schoolCode = localStorage.getItem('erp_school_code');

                if(!portalId || !pin) { alert("Please enter User ID and Password/PIN."); return; }

                btn.innerText = "Checking Credentials..."; btn.disabled = true;

                try {
                    // Search for student in Firebase where portalId or regNo matches
                    let studentQuery = await db.collection("students")
                        .where("schoolCode", "==", schoolCode)
                        .where("portalId", "==", portalId.toLowerCase())
                        .get();

                    // If not found by portalId, try to find by Roll No (Since user created roll no 1 and 2)
                    if (studentQuery.empty) {
                        studentQuery = await db.collection("students")
                            .where("schoolCode", "==", schoolCode)
                            .where("rollNo", "==", portalId)
                            .get();
                    }
                    
                    // If still not found, try regNo exactly
                    if (studentQuery.empty) {
                        studentQuery = await db.collection("students")
                            .where("schoolCode", "==", schoolCode)
                            .where("regNo", "==", portalId)
                            .get();
                    }

                    if (!studentQuery.empty) {
                        let studentData = null;
                        
                        studentQuery.forEach(doc => {
                            const data = doc.data();
                            // Check password/pin match
                            if (data.password === pin || data.pin === pin) {
                                studentData = data;
                            }
                        });

                        if (studentData) {
                            // Student verified successfully!
                            localStorage.setItem('student_active_session', JSON.stringify(studentData));
                            window.location.href = 'student_dashboard.html'; // Go to Student Portal
                        } else {
                            alert("Invalid PIN or Password.");
                        }
                    } else {
                        alert("No student found with this User ID in " + schoolCode);
                    }
                } catch (error) {
                    console.error("Student Login Error:", error);
                    alert("Database Error. Check your connection.");
                } finally {
                    btn.innerText = "Student Login"; btn.disabled = false;
                }
            });

        });
    </script>
</body>
</html>
